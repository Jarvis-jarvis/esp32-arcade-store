<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Wall Pong</title>
<style>
html,body{margin:0;height:100%;background:#1a1405;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:12px;left:0;right:0;text-align:center;color:#fff;font:800 28px system-ui,sans-serif;text-shadow:0 0 10px #ffd200;pointer-events:none;z-index:5}
</style></head><body>
<canvas id="c"></canvas><div id="hud">0</div>
<script src="/lib/arcade.js"></script>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),hud=document.getElementById('hud');
let W,H,dpr,run=false,score=0,last=0,speed=320;
const pad={x:0,y:0,w:90,h:14,tx:0},ball={x:0,y:0,vx:0,vy:0,r:9};
function resize(){
  dpr=devicePixelRatio||1;W=innerWidth;H=innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  pad.y=H-60;if(!run){pad.x=pad.tx=W/2;draw()}
}
addEventListener('resize',resize);
function move(e){pad.tx=e.clientX}
addEventListener('pointermove',move);addEventListener('pointerdown',move);
addEventListener('keydown',e=>{if(!run)return;if(e.key==='ArrowLeft')pad.tx-=50;if(e.key==='ArrowRight')pad.tx+=50});
function start(){
  run=true;score=0;speed=320;pad.w=90;pad.x=pad.tx=W/2;
  ball.x=W/2;ball.y=H*.3;
  const a=(Math.random()*.6+.3)*(Math.random()<.5?-1:1);
  ball.vx=Math.sin(a)*speed;ball.vy=Math.cos(a)*speed;
  hud.textContent='0';last=performance.now();requestAnimationFrame(loop);
}
function over(){run=false;draw();Arcade.over(score,start)}
function loop(t){
  if(!run)return;
  const dt=Math.min((t-last)/1000,.04);last=t;
  pad.x+=(pad.tx-pad.x)*Math.min(1,dt*16);
  pad.x=Math.max(pad.w/2,Math.min(W-pad.w/2,pad.x));
  ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
  if(ball.x<ball.r){ball.x=ball.r;ball.vx=Math.abs(ball.vx)}
  if(ball.x>W-ball.r){ball.x=W-ball.r;ball.vx=-Math.abs(ball.vx)}
  if(ball.y<ball.r){ball.y=ball.r;ball.vy=Math.abs(ball.vy)}
  if(ball.vy>0&&ball.y+ball.r>=pad.y&&ball.y-ball.r<=pad.y+pad.h&&Math.abs(ball.x-pad.x)<=pad.w/2+ball.r){
    ball.y=pad.y-ball.r;
    const off=(ball.x-pad.x)/(pad.w/2);
    speed=Math.min(900,speed*1.04+8);
    ball.vx=off*speed*.8;
    ball.vy=-Math.sqrt(Math.max(speed*speed-ball.vx*ball.vx,(speed*.5)*(speed*.5)));
    score+=10;hud.textContent=score;pad.w=Math.max(54,90-score/8);
  }
  if(ball.y>H+20){over();return}
  draw();requestAnimationFrame(loop);
}
function draw(){
  ctx.fillStyle='#1a1405';ctx.fillRect(0,0,W,H);
  ctx.shadowBlur=16;ctx.shadowColor='#ffd200';ctx.fillStyle='#ffd200';
  ctx.fillRect(pad.x-pad.w/2,pad.y,pad.w,pad.h);
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,7);ctx.fill();
  ctx.shadowBlur=0;
}
resize();
Arcade.menu('WALL PONG','Slide the paddle to bounce the ball. Every hit makes it faster.',start);
</script></body></html>
